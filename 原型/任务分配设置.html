<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务分配设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            padding: 0;
            color: #333;
            line-height: 1.5;
        }

        .page {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header {
            background: #fff;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            line-height: 1.2;
        }

        .card {
            background: #fff;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .card-title { font-size: 14px; font-weight: 600; color: #333; }
        .card-body { padding: 12px 16px; }

        /* 自动分配 - 启用开关 */
        .auto-enable-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .toggle-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .toggle {
            width: 44px;
            height: 22px;
            border-radius: 11px;
            background: #1890ff;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }
        .toggle::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            top: 2px;
            right: 2px;
            transition: transform 0.2s;
        }
        .toggle.off {
            background: #d9d9d9;
        }
        .toggle.off::after {
            transform: translateX(-22px);
        }
        .toggle-label { font-size: 14px; color: #333; }

        /* 适用流程 */
        .section-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .process-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px 24px;
            max-height: 280px;
            overflow-y: auto;
        }
        .process-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }
        .process-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 分配方式 */
        .assign-method {
            margin-bottom: 20px;
        }
        .radio-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        .radio-row input[type="radio"] {
            margin-top: 4px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .radio-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .conditions-wrap {
            margin-top: 16px;
            padding-left: 26px;
        }
        .condition-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .condition-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .scope-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 14px;
            padding-left: 26px;
        }
        .scope-row .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .scope-row input[type="radio"] { width: 16px; height: 16px; cursor: pointer; }
        .mandatory-row {
            margin-top: 14px;
            padding-left: 26px;
        }
        .mandatory-row .radio-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .mandatory-row .radio-desc {
            color: #666;
            font-size: 12px;
        }

        .assign-option {
            margin-bottom: 16px;
        }
        .assign-option:last-child {
            margin-bottom: 0;
        }
        .assign-rule-panel,
        .assign-rule-multi {
            margin-top: 12px;
            padding: 16px;
            border: 1px solid #f0f0f0;
            border-radius: 4px;
            background: #fff;
        }
        .assign-rule-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }
        .assign-rule-prompt {
            font-size: 13px;
            color: #666;
            margin: 0;
            line-height: 1.5;
            flex: 1;
            min-width: 0;
        }
        .physicist-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }
        .physicist-section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .btn {
            height: 32px;
            padding: 0 12px;
            border-radius: 6px;
            border: 1px solid #d9d9d9;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            color: #333;
        }
        .btn.primary {
            background: #1890ff;
            border-color: #1890ff;
            color: #fff;
        }
        .btn:hover { border-color: #1890ff; color: #1890ff; }
        .btn.primary:hover:not(:disabled) { background: #40a9ff; border-color: #40a9ff; color: #fff; }
        .btn-link {
            border: none;
            background: none;
            color: #1890ff;
            padding: 0 8px;
        }
        .btn-link:hover { text-decoration: underline; }

        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border-bottom: 1px solid #f0f0f0;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            color: #666;
        }
        td select, td input[type="number"] {
            width: 100%;
            min-width: 80px;
            height: 28px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            padding: 0 8px;
            font-size: 13px;
        }
        .cell-hint {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        .footer-save {
            background: #fff;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
        }
        .footer-save .btn.primary { min-width: 120px; }
        .ops { display: flex; flex-wrap: wrap; gap: 8px; }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>任务分配设置</h1>
        </div>

        <!-- 自动分配 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">自动分配</div>
            </div>
            <div class="card-body">
                <div class="auto-enable-row">
                    <div class="toggle-wrap">
                        <div class="toggle" id="toggleEnable" title="启用/关闭"></div>
                        <span class="toggle-label">启用</span>
                    </div>
                </div>
                <div class="section-label">适用流程</div>
                <div class="process-grid" id="processGrid">
                    <label class="process-item"><input type="checkbox" /> 直加流程-test</label>
                    <label class="process-item"><input type="checkbox" /> 知情同意书测试</label>
                    <label class="process-item"><input type="checkbox" /> 改计划流程 zlh</label>
                    <label class="process-item"><input type="checkbox" /> test</label>
                    <label class="process-item"><input type="checkbox" /> ART子流程</label>
                    <label class="process-item"><input type="checkbox" /> 表单引用流程</label>
                    <label class="process-item"><input type="checkbox" /> 复制关联费用</label>
                    <label class="process-item"><input type="checkbox" /> 振测-计划关联</label>
                    <label class="process-item"><input type="checkbox" /> 直加流程</label>
                    <label class="process-item"><input type="checkbox" /> 后装流程_子流程</label>
                    <label class="process-item"><input type="checkbox" /> 后装流程</label>
                    <label class="process-item"><input type="checkbox" /> 不要动我得流程,测试中</label>
                    <label class="process-item"><input type="checkbox" /> 测试水平线,不要删除我得</label>
                    <label class="process-item"><input type="checkbox" /> 后装流程_子123</label>
                    <label class="process-item"><input type="checkbox" /> 射波刀流程</label>
                    <label class="process-item"><input type="checkbox" /> 振测生成文档-流程(勿动)</label>
                    <label class="process-item"><input type="checkbox" /> 别删我的表单啊</label>
                    <label class="process-item"><input type="checkbox" /> 振测-生成文档</label>
                    <label class="process-item"><input type="checkbox" /> 测试表单组件格式</label>
                    <label class="process-item"><input type="checkbox" /> 碳离子流程</label>
                    <label class="process-item"><input type="checkbox" /> 振测ART自动完成</label>
                    <label class="process-item"><input type="checkbox" /> 振测-计划关联</label>
                    <label class="process-item"><input type="checkbox" /> 改野流程</label>
                    <label class="process-item"><input type="checkbox" /> 外照射-右键操作</label>
                    <label class="process-item"><input type="checkbox" /> 外照射流程-从计划申请开始</label>
                    <label class="process-item"><input type="checkbox" /> 计划关联</label>
                    <label class="process-item"><input type="checkbox" /> 新增</label>
                    <label class="process-item"><input type="checkbox" /> 完整流程</label>
                    <label class="process-item"><input type="checkbox" /> 计划申请节点开始(PX)</label>
                    <label class="process-item"><input type="checkbox" /> 改计划流程</label>
                    <label class="process-item"><input type="checkbox" /> 通用流程_第三方</label>
                    <label class="process-item"><input type="checkbox" /> 光子流程</label>
                    <label class="process-item"><input type="checkbox" /> ART主流程</label>
                </div>
            </div>
        </div>

        <!-- 分配方式 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">分配方式</div>
            </div>
            <div class="card-body">
                <div class="assign-option">
                    <div class="radio-row">
                        <input type="radio" name="assignMethod" id="methodRoundRobin" value="roundRobin" checked />
                        <label for="methodRoundRobin" class="radio-desc">按物理师轮询分配：按以下添加顺序,将新的计划设计任务轮流分配到上班状态的物理师</label>
                    </div>
                    <div class="assign-rule-panel" id="assignRuleRoundRobin">
                    <div class="assign-rule-head">
                        <p class="assign-rule-prompt">按以下添加顺序，将新的计划设计任务轮流分配到上班状态的物理师</p>
                        <button type="button" class="btn primary" id="btnAddRoundRobin">添加</button>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>姓名</th>
                                    <th>工号</th>
                                    <th>上班状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="roundRobinTbody">
                                <tr>
                                    <td>1</td>
                                    <td>chhwl</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><button type="button" class="btn btn-link btn-remove-robin">移除</button></td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td>李小波</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><button type="button" class="btn btn-link btn-remove-robin">移除</button></td>
                                </tr>
                                <tr>
                                    <td>3</td>
                                    <td>测试物理师</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><button type="button" class="btn btn-link btn-remove-robin">移除</button></td>
                                </tr>
                                <tr>
                                    <td>4</td>
                                    <td>张俊昱</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><button type="button" class="btn btn-link btn-remove-robin">移除</button></td>
                                </tr>
                                <tr>
                                    <td>5</td>
                                    <td>苗余超</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><button type="button" class="btn btn-link btn-remove-robin">移除</button></td>
                                </tr>
                                <tr>
                                    <td>6</td>
                                    <td>郑芬</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><button type="button" class="btn btn-link btn-remove-robin">移除</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                </div>
                <div class="assign-option">
                    <div class="radio-row">
                        <input type="radio" name="assignMethod" id="methodPlanSys" value="planSys" />
                        <label for="methodPlanSys" class="radio-desc">按计划系统分配：将新的计划设计任务,按照计划系统分配到上班状态的物理师</label>
                    </div>
                </div>
                <div class="assign-option">
                    <div class="radio-row">
                        <input type="radio" name="assignMethod" id="methodMulti" value="multi" />
                        <label for="methodMulti" class="radio-desc">多条件组合分配：按需启用多个不同条件,组合成一个分配规则进行分配</label>
                    </div>
                    <div class="assign-rule-multi" id="assignRuleMulti" style="display: none;">
                <div class="conditions-wrap">
                    <div class="section-label">可选条件</div>
                    <label class="condition-item"><input type="checkbox" id="condOnDuty" checked /> 只给"上班中"的物理师分配任务</label>
                    <label class="condition-item"><input type="checkbox" id="condPlanSys" checked /> 区分计划系统,将任务分配给对应物理师</label>
                    <label class="condition-item"><input type="checkbox" id="condLast" checked /> 分配给上次的物理师</label>
                    <div class="scope-row">
                        <span>旧记录范围</span>
                        <label class="radio-item"><input type="radio" name="scope" value="reg" /> 本次登记内</label>
                        <label class="radio-item"><input type="radio" name="scope" value="all" checked /> 患者所有登记</label>
                    </div>
                    <div class="mandatory-row">
                        <span class="section-label">是否必须</span>
                        <label class="radio-item">
                            <input type="radio" name="mandatory" value="yes" />
                            <span>是 <span class="radio-desc">未找到上次物理师,终止自动分配</span></span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="mandatory" value="no" checked />
                            <span>否 <span class="radio-desc">未找到上次物理师,可以分配给其他物理师</span></span>
                        </label>
                    </div>
                    <label class="condition-item" style="margin-top:12px"><input type="checkbox" id="condBacklog" /> 分配时考虑物理师当前积压的任务数</label>
                </div>
                <div class="physicist-section">
                    <div class="physicist-section-head">
                        <span class="section-label">物理师列表</span>
                        <button type="button" class="btn primary" id="btnAdd">添加</button>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>姓名</th>
                                    <th>工号</th>
                                    <th>上班状态</th>
                                    <th>计划系统</th>
                                    <th>任务分配系数<br/><span class="cell-hint">系数越高被分配任务的概率越大</span></th>
                                    <th>单日分配上限<br/><span class="cell-hint">每天最多分配几次</span></th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="physicistTbody">
                                <tr>
                                    <td>1</td>
                                    <td>zhen_phy</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><select><option>请选择</option></select></td>
                                    <td><input type="number" value="10" min="1" /></td>
                                    <td><input type="number" value="3" min="1" /></td>
                                    <td><button type="button" class="btn btn-link btn-remove">移除</button></td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td>二科物理师</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><select><option>请选择</option></select></td>
                                    <td><input type="number" value="10" min="1" /></td>
                                    <td><input type="number" value="3" min="1" /></td>
                                    <td><button type="button" class="btn btn-link btn-remove">移除</button></td>
                                </tr>
                                <tr>
                                    <td>3</td>
                                    <td>测试物理师</td>
                                    <td>—</td>
                                    <td><select><option>上班中</option><option>下班</option></select></td>
                                    <td><select><option>请选择</option></select></td>
                                    <td><input type="number" value="10" min="1" /></td>
                                    <td><input type="number" value="6" min="1" /></td>
                                    <td><button type="button" class="btn btn-link btn-remove">移除</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                </div>
                </div>
            </div>
        </div>

        <div class="footer-save">
            <button type="button" class="btn primary" id="btnSave">保存</button>
        </div>
    </div>

    <script>
        (function () {
            var toggle = document.getElementById('toggleEnable');
            if (toggle) {
                toggle.classList.add('off');
                toggle.addEventListener('click', function () {
                    this.classList.toggle('off');
                });
                // 图中为启用状态，改为不包含 off
                toggle.classList.remove('off');
            }

            // 分配方式：按选中项显示对应规则内容
            var assignRuleRoundRobin = document.getElementById('assignRuleRoundRobin');
            var assignRuleMulti = document.getElementById('assignRuleMulti');
            var methodRoundRobin = document.getElementById('methodRoundRobin');
            var methodMulti = document.getElementById('methodMulti');
            function toggleAssignRulePanels() {
                var isRoundRobin = methodRoundRobin && methodRoundRobin.checked;
                var isMulti = methodMulti && methodMulti.checked;
                if (assignRuleRoundRobin) assignRuleRoundRobin.style.display = isRoundRobin ? 'block' : 'none';
                if (assignRuleMulti) assignRuleMulti.style.display = isMulti ? 'block' : 'none';
            }
            toggleAssignRulePanels();
            document.querySelectorAll('input[name="assignMethod"]').forEach(function (radio) {
                radio.addEventListener('change', toggleAssignRulePanels);
            });

            // 按物理师轮询：添加/移除行
            var roundRobinTbody = document.getElementById('roundRobinTbody');
            function updateRoundRobinNos() {
                if (!roundRobinTbody) return;
                roundRobinTbody.querySelectorAll('tr').forEach(function (row, i) {
                    row.cells[0].textContent = i + 1;
                });
            }
            document.getElementById('btnAddRoundRobin')?.addEventListener('click', function () {
                if (!roundRobinTbody) return;
                var n = roundRobinTbody.querySelectorAll('tr').length + 1;
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + n + '</td><td>新物理师</td><td>—</td>' +
                    '<td><select><option>上班中</option><option>下班</option></select></td>' +
                    '<td><button type="button" class="btn btn-link btn-remove-robin">移除</button></td>';
                roundRobinTbody.appendChild(tr);
                tr.querySelector('.btn-remove-robin').addEventListener('click', function () { tr.remove(); updateRoundRobinNos(); });
                updateRoundRobinNos();
            });
            roundRobinTbody?.querySelectorAll('.btn-remove-robin').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    this.closest('tr').remove();
                    updateRoundRobinNos();
                });
            });

            // 图中勾选的流程：计划申请节点开始(PX)、改计划流程 zlh、外照射-右键操作、完整流程
            var processGrid = document.getElementById('processGrid');
            if (processGrid) {
                var labels = processGrid.querySelectorAll('label');
                var checkedTexts = ['计划申请节点开始(PX)', '改计划流程 zlh', '外照射-右键操作', '完整流程'];
                labels.forEach(function (label) {
                    var text = (label.textContent || '').trim().replace(/^\s*/, '');
                    if (checkedTexts.some(function (t) { return text.indexOf(t) !== -1; })) {
                        var cb = label.querySelector('input[type="checkbox"]');
                        if (cb) cb.checked = true;
                    }
                });
            }

            var tbody = document.getElementById('physicistTbody');
            document.getElementById('btnAdd')?.addEventListener('click', function () {
                var rows = tbody.querySelectorAll('tr');
                var n = rows.length + 1;
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + n + '</td><td>新物理师</td><td>—</td>' +
                    '<td><select><option>上班中</option><option>下班</option></select></td>' +
                    '<td><select><option>请选择</option></select></td>' +
                    '<td><input type="number" value="10" min="1" /></td>' +
                    '<td><input type="number" value="3" min="1" /></td>' +
                    '<td><button type="button" class="btn btn-link btn-remove">移除</button></td>';
                tbody.appendChild(tr);
                tr.querySelector('.btn-remove').addEventListener('click', function () {
                    alert('该物理师还有任务未提交，无法移除');
                });
                updateNos();
            });

            function updateNos() {
                tbody.querySelectorAll('tr').forEach(function (row, i) {
